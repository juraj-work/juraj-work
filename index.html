<script>
  // writes text into an element and turns web / e-mail addresses into links
  function addLinked(el, text) {
    text.split(/(https?:\/\/\S+|www\.\S+|[\w.+-]+@[\w-]+\.[\w.-]+)/g).forEach((part, i) => {
      if (i % 2 === 0) { el.append(part); return; }
      const a = document.createElement('a');
      a.textContent = part;
      a.href = part.includes('@') ? 'mailto:' + part : (part.startsWith('http') ? part : 'https://' + part);
      a.target = '_blank';
      el.append(a);
    });
  }

  Promise.all([
    fetch('cv.txt').then(r => r.ok ? r.text() : '').catch(() => ''),   // text shown when the first photo is clicked
    fetch('images.json').then(r => r.json())
  ]).then(([cv, items]) => {
    const gallery = document.getElementById('gallery');
    let current = [];                                   // info of the latest project start
    items.forEach((item, idx) => {
      const file = typeof item === 'string' ? item : item.file;
      if (typeof item === 'object') {
        const own = Object.entries(item).filter(([k, v]) => k !== 'file' && k !== 'title' && String(v).trim());
        if (own.length) current = own;                  // a photo with info starts a new project
      }
      const wrap = document.createElement('div');
      wrap.className = 'photo';
      const img = document.createElement('img');
      img.src = 'images/' + encodeURIComponent(file);
      img.alt = '';
      wrap.append(img);

      let box = null;
      if (idx === 0 && cv.trim()) {                     // first photo: shows the CV text
        box = document.createElement('div');
        box.className = 'photo-info cv';
        addLinked(box, cv.trim());
      } else if (current.length) {                      // other photos: info of their project
        box = document.createElement('div');
        box.className = 'photo-info';
        current.forEach(([k, v]) => {
          const line = document.createElement('div');
          line.textContent = k + ': ' + v;
          box.append(line);
        });
      }
      if (box) {
        wrap.classList.add('has-info');
        wrap.addEventListener('click', () => {
          const open = !box.classList.contains('open');
          document.querySelectorAll('.photo-info.open').forEach(b => b.classList.remove('open'));
          box.classList.toggle('open', open);
        });
        wrap.append(box);
      }
      gallery.append(wrap);
    });
  }).catch(err => console.error('images.json could not be loaded:', err));
</script>
