<script>
  fetch('images.json')
    .then(r => r.json())
    .then(items => {
      const gallery = document.getElementById('gallery');
      let current = [];                                   // info of the latest project start
      items.forEach(item => {
        const file = typeof item === 'string' ? item : item.file;
        if (typeof item === 'object') {
          const own = Object.entries(item).filter(([k, v]) => k !== 'file' && k !== 'title' && String(v).trim());
          if (own.length) current = own;                  // a photo with info starts a new project
        }
        const wrap = document.createElement('div');
        wrap.className = 'photo';
        const img = document.createElement('img');
        img.src = 'images/' + encodeURIComponent(file);
        img.alt = '';
        wrap.append(img);
        if (current.length) {
          const box = document.createElement('div');
          box.className = 'photo-info';
          current.forEach(([k, v]) => {
            const line = document.createElement('div');
            line.textContent = k + ': ' + v;
            box.append(line);
          });
          wrap.classList.add('has-info');
          wrap.addEventListener('click', () => {
            const open = !box.classList.contains('open');
            document.querySelectorAll('.photo-info.open').forEach(b => b.classList.remove('open'));
            box.classList.toggle('open', open);
          });
          wrap.append(box);
        }
        gallery.append(wrap);
      });
    })
    .catch(err => console.error('images.json could not be loaded:', err));
</script>

</body>
